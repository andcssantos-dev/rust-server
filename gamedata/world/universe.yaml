# ==============================================================================
# DIMENSÕES DO UNIVERSO E QUADRANTES - AURENFALL
# ==============================================================================

dimensions:
  # Extensão global estimada do mundo infinito em km²
  total_universe_extent_km: 9000000000

  # Tamanho da aresta de um quadrante em centímetros (81920.0 cm = 819.2 metros)
  quadrant_side_length_cm: 81920.0

streaming:
  # Quantos quadrantes ao redor do jogador são renderizados no cliente UE5
  client_reveal_radius_quadrants: 1

  # Quantos quadrantes à frente o servidor prepara em background nas threads
  server_prep_margin_quadrants: 2

  # Tempo em milissegundos para liberar quadrantes da memória se ninguém estiver perto
  quadrant_cache_timeout_ms: 60000