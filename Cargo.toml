[workspace]
resolver = "2"
members = [
    "apps/world-server",
    "apps/gamedata-compiler",
    "apps/protocol-client",
    "apps/dev-certgen",
    "crates/cache",
    "crates/config",
    "crates/contracts",
    "crates/core",
    "crates/domain",
    "crates/gamedata",
    "crates/observability",
    "crates/persistence",
    "crates/preparation",
    "crates/session",
    "crates/simulation",
    "crates/terrain",
    "crates/transport",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
repository = "https://github.com/andcssantos/aurenfall-server"

[workspace.dependencies]
anyhow = "1"
blake3 = "1"
bytes = "1"
getrandom = "0.3"
hecs = "0.10.5"
quinn = "0.11"
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-postgres = "0.7"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -2 }
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
perf = "warn"
complexity = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
